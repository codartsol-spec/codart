<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Post | CODART</title>
  <meta name="description" content="Read the full article on the CODART blog." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>" />
  <style>
    :root {
      --bg: #0a0f1e;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.08);
      --accent: #6366f1;
      --gold: #c9a227;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --font-head: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      background-image: radial-gradient(circle at 20% 10%, rgba(99,102,241,0.1) 0%, transparent 50%);
    }

    /* ── Top Bar ── */
    .top-bar {
      position: sticky; top:0; z-index:100;
      background: rgba(10,15,30,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 0 40px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .top-bar-brand { font-family: var(--font-head); font-size:1.2rem; font-weight:800; color:var(--text); text-decoration:none; letter-spacing:-0.02em; }
    .top-bar-brand span { color: var(--gold); }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.85rem; font-weight: 500;
      color: var(--text-muted); text-decoration: none;
      padding: 7px 16px; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50px; transition: all 0.2s ease;
    }
    .back-link:hover { color: var(--text); border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.04); }

    /* ── Layout ── */
    .post-container {
      max-width: 820px; margin: 0 auto;
      padding: 60px 32px 100px;
    }

    /* ── Cover Image ── */
    .post-cover {
      width: 100%; height: 420px;
      object-fit: cover; border-radius: 20px;
      margin-bottom: 48px;
      border: 1px solid var(--card-border);
    }
    .post-cover-placeholder {
      width: 100%; height: 420px;
      border-radius: 20px; margin-bottom: 48px;
      display: flex; align-items: center; justify-content: center;
      font-size: 5rem;
      background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(201,162,39,0.05));
      border: 1px solid var(--card-border);
    }

    /* ── Meta ── */
    .post-meta {
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap; margin-bottom: 20px;
    }
    .post-category {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--accent);
      background: rgba(99,102,241,0.12); padding: 4px 12px; border-radius: 50px;
    }
    .post-date { font-size: 0.85rem; color: var(--text-muted); }
    .post-author { font-size: 0.85rem; color: var(--text-muted); }
    .meta-sep { color: rgba(255,255,255,0.2); }

    /* ── Title ── */
    .post-title {
      font-family: var(--font-head);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800; line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
    }
    .post-excerpt {
      font-size: 1.15rem; color: var(--text-muted);
      line-height: 1.75; margin-bottom: 40px;
      padding-bottom: 40px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    /* ── Content ── */
    .post-content { line-height: 1.85; font-size: 1.05rem; color: #cbd5e1; }
    .post-content h2 {
      font-family: var(--font-head);
      font-size: 1.7rem; font-weight: 700;
      color: var(--text); margin: 40px 0 16px;
      letter-spacing: -0.02em;
    }
    .post-content h3 {
      font-family: var(--font-head);
      font-size: 1.3rem; font-weight: 600;
      color: var(--text); margin: 32px 0 12px;
    }
    .post-content p { margin-bottom: 20px; }
    .post-content ul, .post-content ol {
      padding-left: 28px; margin-bottom: 20px;
    }
    .post-content li { margin-bottom: 8px; }
    .post-content strong { color: var(--text); font-weight: 600; }
    .post-content a { color: var(--gold); text-decoration: underline; }
    .post-content blockquote {
      border-left: 3px solid var(--gold);
      padding: 16px 24px; margin: 28px 0;
      background: rgba(201,162,39,0.06);
      border-radius: 0 12px 12px 0;
      font-style: italic; color: var(--text-muted);
    }
    .post-content img { max-width: 100%; border-radius: 12px; margin: 20px 0; }
    .post-content code {
      background: rgba(99,102,241,0.15); padding: 2px 8px;
      border-radius: 4px; font-size: 0.9em; color: #a5b4fc;
    }
    .post-content pre {
      background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 20px; overflow-x: auto;
      margin: 20px 0;
    }
    .post-content pre code { background: none; padding: 0; }

    /* ── Back CTA ── */
    .post-back-cta {
      margin-top: 60px; padding-top: 40px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
    }
    .post-back-cta .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px; border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text-muted); text-decoration: none;
      font-size: 0.9rem; font-weight: 500;
      transition: all 0.2s ease;
    }
    .post-back-cta .back-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
    .post-back-cta .cta-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 28px; border-radius: 50px;
      background: var(--gold); color: #0a0f1e;
      font-size: 0.9rem; font-weight: 700;
      text-decoration: none; transition: filter 0.2s ease;
    }
    .post-back-cta .cta-btn:hover { filter: brightness(1.1); }

    /* ── Not found ── */
    .not-found {
      text-align: center; padding: 100px 20px;
      color: var(--text-muted);
    }
    .not-found h2 { font-family: var(--font-head); font-size: 2rem; color: var(--text); margin-bottom: 12px; }

    @media (max-width: 768px) {
      .post-container { padding: 40px 20px 80px; }
      .post-cover, .post-cover-placeholder { height: 240px; }
      .top-bar { padding: 0 20px; }
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <a href="index.html" class="top-bar-brand">COD<span>ART</span> ™</a>
    <a href="blogs.html" class="back-link">← Back to Blog</a>
  </div>

  <main class="post-container" id="postContainer">
    <div class="not-found">
      <div style="font-size:3rem;margin-bottom:16px;">⏳</div>
      <h2>Loading post…</h2>
    </div>
  </main>

  <script>
    const DEFAULT_POSTS = [
      {
        id: 1,
        title: "Why Your Business Needs a Custom Website (Not Just a Template)",
        slug: "custom-website-vs-template",
        category: "Web Development",
        date: "2026-04-10",
        excerpt: "Templates are a good starting point, but they rarely convert. Here's why investing in a custom-built website pays for itself within months.",
        image: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&q=80&w=800",
        icon: "💻",
        content: `<h2>Templates vs Custom: The Real Difference</h2>
<p>When starting out, many businesses reach for a pre-made template. It's fast, cheap, and often looks good enough. But "good enough" is the problem.</p>
<p>A template is designed for everyone — which means it's optimised for no one. A custom website is built around your specific customers, your specific goals, and your specific brand voice.</p>
<h2>The Conversion Problem</h2>
<p>Studies consistently show that custom-designed websites outperform template sites by 40-60% in conversion rate. Why? Because every element — the CTA placement, the colour psychology, the content flow — is intentionally crafted to guide a visitor toward becoming a client.</p>
<h2>What We Do Differently at CODART</h2>
<p>We don't apply a template and change the logo. We start from your goals, your audience, and your brand, then build something that actually works for your business.</p>`,
        published: true
      },
      {
        id: 2,
        title: "5 Logo Design Mistakes That Are Killing Your Brand",
        slug: "logo-design-mistakes",
        category: "Branding",
        date: "2026-03-28",
        excerpt: "A bad logo does more damage than no logo at all. We break down the five most common logo mistakes and how to fix them.",
        image: "https://images.unsplash.com/photo-1558655146-9f40138edfeb?auto=format&fit=crop&q=80&w=800",
        icon: "✦",
        content: `<h2>Your Logo Is Your First Impression</h2>
<p>Before a customer reads a single word about your business, they've already formed an opinion based on your logo. This visual judgment happens in milliseconds — and it's nearly impossible to override.</p>
<h2>Mistake 1: Using Too Many Colours</h2>
<p>A strong logo typically uses 1-3 colours maximum. More than that creates visual noise and becomes a nightmare to reproduce on merchandise, embroidery, and single-colour backgrounds.</p>
<h2>Mistake 2: Following Trends Instead of Identity</h2>
<p>Gradient logos were everywhere in 2020. Flat logos in 2018. Chasing design trends means your logo will look dated within two years. Build for timelessness, not trends.</p>
<h2>Mistake 3: Scaling Issues</h2>
<p>Your logo must work at every size — from a business card thumbnail to a billboard. Always design and test at multiple scales before finalising.</p>
<h2>Mistake 4: Illegible Typography</h2>
<p>Script fonts look beautiful in presentations. They're often unreadable at small sizes, on noisy backgrounds, or when embroidered on a shirt. Choose fonts that are distinctive AND legible.</p>
<h2>Mistake 5: Designing for Yourself, Not Your Audience</h2>
<p>Your personal taste doesn't matter as much as your customer's perception. A luxury law firm and a kids' toy brand need completely different visual languages, regardless of what the owner personally likes.</p>`,
        published: true
      },
      {
        id: 3,
        title: "How We Built a Bilingual Restaurant Website for Japan",
        slug: "siddique-jp-restaurant-case-study",
        category: "Case Study",
        date: "2026-03-05",
        excerpt: "Behind the scenes of building Siddique JP — a multilingual WordPress site for a Japanese restaurant that needed to attract both local and international diners.",
        image: "https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&q=80&w=800",
        icon: "🌐",
        content: `<h2>The Brief</h2>
<p>Siddique JP is a halal Japanese-Pakistani fusion restaurant based in Tokyo. They needed a website that could serve two audiences simultaneously: Japanese-speaking locals and English-speaking expats and tourists.</p>
<h2>The Challenge</h2>
<p>Building a bilingual WordPress site is technically straightforward with the right plugins. The real challenge was maintaining brand consistency and visual hierarchy across both languages, since Japanese and English text wrap and flow very differently.</p>
<h2>Our Approach</h2>
<p>We used WPML for language switching and built a completely custom theme from scratch — no off-the-shelf templates. Every section was designed to work in both languages simultaneously, tested at multiple viewport sizes.</p>
<h2>The Result</h2>
<p>Within 3 months of launch, the restaurant reported a 35% increase in online reservations. The bilingual menu and booking system removed friction for non-Japanese speakers and significantly expanded their customer base.</p>`,
        published: true
      }
    ];

    function loadPosts() {
      try {
        const stored = localStorage.getItem('codart_blogs');
        return stored ? JSON.parse(stored) : DEFAULT_POSTS;
      } catch(e) { return DEFAULT_POSTS; }
    }

    function formatDate(d) {
      try { return new Date(d).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }); }
      catch(e) { return d; }
    }

    function render() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'));
      const posts = loadPosts();
      const post = posts.find(p => p.id === id);
      const container = document.getElementById('postContainer');

      if (!post) {
        container.innerHTML = `<div class="not-found">
          <div style="font-size:3rem;margin-bottom:16px;">🔍</div>
          <h2>Post Not Found</h2>
          <p>This post may have been removed or the link is incorrect.</p>
          <a href="blogs.html" style="display:inline-block;margin-top:24px;color:var(--gold);">← Back to Blog</a>
        </div>`;
        return;
      }

      // Update page title & meta
      document.title = `${post.title} | CODART Blog`;

      const coverHtml = post.image
        ? `<img class="post-cover" src="${post.image}" alt="${post.title}" onerror="this.outerHTML='<div class=\\'post-cover-placeholder\\'>${post.icon||'📝'}</div>'" />`
        : `<div class="post-cover-placeholder">${post.icon||'📝'}</div>`;

      container.innerHTML = `
        ${coverHtml}
        <div class="post-meta">
          <span class="post-category">${post.category}</span>
          <span class="meta-sep">·</span>
          <span class="post-date">${formatDate(post.date)}</span>
          <span class="meta-sep">·</span>
          <span class="post-author">by CODART</span>
        </div>
        <h1 class="post-title">${post.title}</h1>
        <p class="post-excerpt">${post.excerpt}</p>
        <div class="post-content">${post.content || '<p>Content coming soon.</p>'}</div>
        <div class="post-back-cta">
          <a href="blogs.html" class="back-btn">← Back to Blog</a>
          <a href="index.html#contact" class="cta-btn">Work With Us ✦</a>
        </div>
      `;
    }

    render();
  </script>

</body>
</html>
